<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Employee Records</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f8f9fa;
    }
    .container {
      max-width: 900px;
      margin-top: 50px;
    }
    .table th {
      background-color: #0056b3;
      color: white;
    }
    .profile-pic img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
    }
    .btn-back, .btn-logout {
      margin-top: 20px;
    }
    h2 {
      color: #0056b3;
      text-align: center;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Admin Dashboard - Employee Records</h2>
    
    <table class="table table-bordered table-striped mt-4">
      <thead>
        <tr>
          <th>Profile</th>
          <th>Name</th>
          <th>Email</th>
          <th>Salary</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for emp in employees %}
        <tr>
          <td class="profile-pic">
            {% if emp.profile_picture %}
            <img src="{{ url_for('static', filename='uploads/' ~ emp.profile_picture) }}" alt="Profile Picture">
            {% else %}
            <span>No Image</span>
            {% endif %}
          </td>
          <td>{{ emp.name }}</td>
          <td>{{ emp.email }}</td>
          <td>{{ emp.salary }}</td>
          <td>
            <a href="{{ url_for('view', name=emp.name | urlencode) }}" class="btn btn-info btn-sm">View</a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>

    <div class="d-flex justify-content-between">
      <a href="/" class="btn btn-secondary btn-back">Back to Home</a>
      <a href="{{ url_for('admin_logout') }}" class="btn btn-danger btn-logout">Logout</a>
    </div>
  </div>
</body>
</html>
