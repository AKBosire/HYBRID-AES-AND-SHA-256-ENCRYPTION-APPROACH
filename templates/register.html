<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Employee</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    /* Base Styles */
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background-color: #f8f9fa;
      color: #000;
      transition: all 0.3s ease-in-out;
    }
    .container {
      max-width: 600px;
    }
    /* Form Container */
    .form-container {
      background: #fff;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      animation: fadeIn 0.5s ease-in-out;
      margin-top: 50px;
    }
    h2 {
      font-size: 2.5rem;
      font-weight: 700;
      color: #0056b3;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    label {
      font-weight: 500;
      margin-bottom: 5px;
    }
    /* Input Fields */
    .form-control {
      border-radius: 8px;
      box-shadow: none;
      border: 1px solid #ced4da;
      transition: border-color 0.3s ease;
    }
    .form-control:focus {
      border-color: #0056b3;
      box-shadow: none;
    }
    /* Buttons */
    .btn {
      padding: 10px 20px;
      font-size: 1.1rem;
      font-weight: 600;
      text-transform: uppercase;
      transition: all 0.3s ease;
      border-radius: 50px;
      overflow: hidden;
      position: relative;
    }
    .btn-primary {
      background-color: #0056b3;
      border-color: #0056b3;
    }
    .btn-primary:hover {
      background-color: #004080;
      border-color: #004080;
    }
    .btn-secondary {
      background-color: #6c757d;
      border-color: #6c757d;
    }
    .btn-secondary:hover {
      background-color: #5a6268;
      border-color: #545b62;
    }
    /* Utility Classes */
    .d-grid {
      row-gap: 15px;
    }
    .text-center {
      text-align: center;
    }
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #343a40;
      color: #fff;
      padding: 10px 0;
      text-align: center;
      font-size: 0.9rem;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <div class="form-container">
      <h2 class="text-center">Register Employee</h2>
      <form action="/register" method="post" enctype="multipart/form-data" class="d-grid">
        <!-- Basic Details -->
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" id="name" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" name="email" class="form-control" required>
        </div>
        <!-- Password Field for Login -->
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="dob" class="form-label">Date of Birth</label>
          <input type="date" id="dob" name="dob" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="position" class="form-label">Position</label>
          <input type="text" id="position" name="position" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="salary" class="form-label">Salary</label>
          <input type="number" id="salary" name="salary" class="form-control" required>
        </div>
        <!-- Additional Details -->
        <div class="mb-3">
          <label for="phone" class="form-label">Phone Number</label>
          <input type="text" id="phone" name="phone" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="address" class="form-label">Address</label>
          <textarea id="address" name="address" class="form-control" rows="2" required></textarea>
        </div>
        <div class="mb-3">
          <label for="department" class="form-label">Department</label>
          <input type="text" id="department" name="department" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="hire_date" class="form-label">Hire Date</label>
          <input type="date" id="hire_date" name="hire_date" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="emergency_contact" class="form-label">Emergency Contact</label>
          <input type="text" id="emergency_contact" name="emergency_contact" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="country" class="form-label">Country</label>
          <input type="text" id="country" name="country" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="bio" class="form-label">Short Bio</label>
          <textarea id="bio" name="bio" class="form-control" rows="3"></textarea>
        </div>
        <div class="mb-3">
          <label for="linkedin" class="form-label">LinkedIn Profile</label>
          <input type="url" id="linkedin" name="linkedin" class="form-control" placeholder="https://www.linkedin.com/in/yourprofile">
        </div>
        <div class="mb-3">
          <label for="twitter" class="form-label">Twitter Handle</label>
          <input type="text" id="twitter" name="twitter" class="form-control" placeholder="@yourhandle">
        </div>
        <div class="mb-3">
          <label for="profile_picture" class="form-label">Profile Picture</label>
          <input type="file" id="profile_picture" name="profile_picture" class="form-control" accept="image/*">
        </div>
        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary">Register</button>
          <a href="/" class="btn btn-secondary">Back</a>
        </div>
      </form>
    </div>
  </div>
  <footer class="footer">
    <p>© 2025 Your Company Name. All rights reserved.</p>
  </footer>
</body>
</html>
