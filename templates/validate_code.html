<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validate Verification Code</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    /* Basic styling for the verification page */
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding-top: 50px;
    }
    .container {
      max-width: 400px;
    }
    .form-container {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }
    h2 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #0056b3;
      text-align: center;
      margin-bottom: 20px;
    }
    .btn {
      border-radius: 50px;
      font-size: 1rem;
      padding: 10px 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="form-container">
      <h2>Enter Verification Code</h2>
      <!-- Display flash messages if any -->
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
      {% endwith %}
      <form action="{{ url_for('validate_code') }}" method="post">
        <div class="mb-3">
          <label for="code" class="form-label">Verification Code</label>
          <input type="text" id="code" name="code" class="form-control" placeholder="Enter code" required>
        </div>
        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary">Verify</button>
          <a href="{{ url_for('login') }}" class="btn btn-secondary">Back to Login</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
