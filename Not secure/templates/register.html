<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Employee Registration (INSECURE)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .form-container {
            background: white;
            max-width: 650px;
            width: 100%;
            padding: 50px 45px;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.18);
            transition: transform 0.3s ease;
        }

        .form-container:hover {
            transform: translateY(-10px);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header img {
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .icon {
            font-size: 68px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 30px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 17px;
            color: #e74c3c;
            font-weight: 500;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #444;
            font-size: 15px;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        input:focus, select:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
            outline: none;
        }

        button {
            grid-column: span 2;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            background: linear-gradient(135deg, #5a6fd8, #6b4190);
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.5);
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            font-size: 14px;
            color: #888;
        }

        .warning {
            background: #fff3cd;
            color: #856404;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 25px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="header">
            <img src="https://picsum.photos/id/1015/800/200" alt="Employee Registration">
            <div class="icon">👤</div>
            <h1>Welcome to Employee Registration</h1>
            <p class="subtitle">(INSECURE)</p>
        </div>

        <div class="warning">
            ⚠️ This portal is running in insecure mode for demonstration purposes only.
        </div>

        <form method="POST" action="{{ url_for('register') }}">
            <div>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="full-width">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div>
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone">
            </div>

            <div>
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob">
            </div>

            <div>
                <label for="position">Position:</label>
                <input type="text" id="position" name="position">
            </div>

            <div>
                <label for="salary">Salary:</label>
                <input type="number" id="salary" name="salary" step="0.01">
            </div>

            <div class="full-width">
                <label for="department">Department:</label>
                <input type="text" id="department" name="department">
            </div>

            <div class="full-width">
                <label for="address">Address:</label>
                <input type="text" id="address" name="address">
            </div>

            <div class="full-width">
                <label for="emergency_contact">Emergency Contact:</label>
                <input type="text" id="emergency_contact" name="emergency_contact">
            </div>

            <button type="submit">Register Employee</button>
        </form>

        <div class="footer">
            Employee Portal • Secure &amp; Simple (Demonstration Only)
        </div>
    </div>
</body>
</html>
